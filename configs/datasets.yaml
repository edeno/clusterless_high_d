# Dataset registry for batch processing
# Each entry maps a dataset_id to Spyglass query parameters and metadata

rat01_day1:
  # Spyglass query parameters
  spyglass_query:
    nwb_file_name: 'rat01_20230101.nwb'
    interval_list_name: 'run_task'
    sort_group_id: 0

  # Metadata
  region: 'CA1'
  n_contacts: 16
  description: 'Rat01 day 1, high-D CA1 recording during run task'

