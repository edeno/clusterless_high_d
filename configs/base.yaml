# Base configuration for clusterless decoding

# Decoding parameters
decoding:
  # Time window for decoding (seconds)
  time_window: 0.5

  # Time step between windows (seconds)
  time_step: 0.05

  # Spatial grid resolution (cm)
  spatial_resolution: 1.0

  # Position range (cm) [xmin, xmax, ymin, ymax]
  position_range: [0, 100, 0, 100]

# High-dimensional specific settings
high_dimensional:
  # Threshold for "high-D" (number of contacts)
  n_contacts_threshold: 8

  # Use sparse matrix operations for high-D
  use_sparse: true

  # Enable GPU acceleration if available
  use_gpu: false

# Feature extraction
features:
  # Mark amplitude threshold (std)
  amplitude_threshold: 4.0

  # Frequency band for filtering (Hz)
  frequency_band: [0, 500]

  # Use multiunit features
  multiunit: true

# Decoder settings
# NOTE: This repo is for testing different decoder designs for high-contact probes.
# The standard KDE approach doesn't scale well. Switch 'type' to test alternatives.
decoder:
  # Decoder type - switch to test different implementations:
  #   'clusterless_kde' - Standard KDE (from non_local_detector, slow for high-D)
  #   'gpu_kde' - GPU-accelerated KDE (if implemented)
  #   'parametric' - Parametric model (if implemented)
  #   'hybrid' - Hybrid approach (if implemented)
  #   'placeholder' - Dummy decoder for testing
  type: 'placeholder'

  # KDE-specific parameters (if using KDE variants)
  kde_bandwidth: null  # auto-select

  # Prior type ('uniform', 'empirical')
  prior_type: 'uniform'

  # Additional decoder-specific parameters can go here
  # e.g., dimensionality_reduction: 'pca', n_components: 10, etc.

# Output settings
output:
  # Save full posterior (can be large)
  save_full_posterior: true

  # Save decoded position (argmax)
  save_decoded_position: true

  # Compression for npz files
  compress: true
