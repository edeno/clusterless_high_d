# Plotting configuration

# General settings
general:
  # DPI for saved figures
  dpi: 300

  # Figure format (png, pdf, svg)
  format: 'png'

  # Use headless backend (for servers without display)
  headless: false

# Posterior plot settings
posterior:
  # Show confidence bands
  show_confidence: true

  # Colormap
  cmap: 'viridis'

  # vmin/vmax for color scaling (null = auto)
  vmin: null
  vmax: null

  # Show actual position overlay
  show_actual_position: true

  # Actual position color and style
  actual_position_color: 'red'
  actual_position_alpha: 0.7

# Summary plot settings
summary:
  # Include metrics panel
  show_metrics: true

  # Include position error plot
  show_error: true

  # Number of time bins to show in examples
  n_example_bins: 10

# Figure size (inches)
figsize:
  posterior: [12, 8]
  summary: [16, 10]

# Font settings
fonts:
  title_size: 14
  label_size: 12
  tick_size: 10
